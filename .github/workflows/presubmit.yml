name: CI - Presubmit

on:
  # Enable remote connections. Add a workflow dispatch to enable halting.
  # See go/ml-github-actions:connect#enable-workflow-dispatch.
  workflow_dispatch:
    inputs:
      halt-for-connection:
        description: 'Should this workflow run wait for a remote connection?'
        type: choice
        default: 'no'
        options:
          - 'yes'
          - 'no'
      bypass-tpu-v5:
        description: 'Bypass TPU v5 presubmit tests?'
        type: boolean
        default: false
      override_base_sha:
        description: 'Override Base SHA for bazel-diff (optional)'
        required: false
        type: string
      override_current_sha:
        description: 'Override Current SHA for bazel-diff (optional)'
        required: false
        type: string
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read
  pull-requests: read
  issues: read

# Cancel old jobs when they are replaced by new runs
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  # Don't cancel in-progress jobs for main branch
  cancel-in-progress: ${{ github.ref != 'main' }}

jobs:
  setup:
    name: "Presubmit Setup"
    runs-on: ubuntu-latest
    outputs:
      job_matrix: ${{ steps.set-matrix.outputs.job_matrix }}
      tpu_v5_bypassed: ${{ steps.set-matrix.outputs.tpu_v5_bypassed }}
      should_run: ${{ steps.set-matrix.outputs.should_run }}
    steps:
      - id: set-matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          LABEL_ADDED: ${{ github.event.label.name }}
          PR_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          INPUT_BYPASS: ${{ inputs.bypass-tpu-v5 }}
        run: |
          python3 -c "
          import json, os, re

          event_name = os.environ.get('EVENT_NAME', '')
          event_action = os.environ.get('EVENT_ACTION', '')
          label_added = os.environ.get('LABEL_ADDED', '')
          labels_json = os.environ.get('PR_LABELS', '[]')
          pr_title = os.environ.get('PR_TITLE', '')
          pr_body = os.environ.get('PR_BODY', '')
          input_bypass = str(os.environ.get('INPUT_BYPASS', 'false')).strip().lower() == 'true'

          try:
              labels = json.loads(labels_json) if labels_json else []
          except Exception:
              labels = []

          ci_control_labels = {
              'ci:bypass-tpu-v5', 'ci:skip-tpu-v5', 'bypass-tpu-v5', 'skip-tpu-v5',
              'ci:replace-tpu-v5', 'replace-tpu-v5', 'ci:replace-tpu-v5-rbe',
              'replace-tpu-v5-with-rbe', 'ci:disable-bazel-diff', 'run-presubmit'
          }

          should_run = True
          if event_name == 'pull_request' and event_action == 'labeled':
              if label_added not in ci_control_labels:
                  should_run = False

          bypass_labels = {
              'ci:bypass-tpu-v5', 'ci:skip-tpu-v5', 'bypass-tpu-v5', 'skip-tpu-v5',
              'ci:replace-tpu-v5', 'replace-tpu-v5', 'ci:replace-tpu-v5-rbe',
              'replace-tpu-v5-with-rbe'
          }
          has_bypass_label = any(l in bypass_labels for l in labels)

          tag_pattern = r'\[(skip|bypass)[-_]tpu[-_]?v?5\]'
          has_tag = bool(re.search(tag_pattern, pr_title, re.I) or re.search(tag_pattern, pr_body, re.I))

          bypass_v5 = input_bypass or has_bypass_label or has_tag

          cpu_job = {
              'name': 'CPU',
              'runner': 'linux-x86-n4-16',
              'config': 'ci_cpu_presubmit',
              'extra_flags': ''
          }
          v5_job = {
              'runner': 'linux-x86-ct5lp-224-8tpu',
              'config': 'ci_tpu_v5_presubmit',
              'extra_flags': '--run_under=\"$(pwd)/ci/tools/parallel_accelerator_execute.sh\"'
          }
          v7_job = {
              'runner': 'linux-x86-tpu7x-224-4tpu',
              'config': 'ci_tpu_v7_presubmit',
              'extra_flags': '--run_under=\"$(pwd)/ci/tools/parallel_accelerator_execute.sh\"'
          }

          matrix = [cpu_job, v7_job] if bypass_v5 else [cpu_job, v5_job, v7_job]

          output_path = os.environ.get('GITHUB_OUTPUT', '')
          if output_path:
              with open(output_path, 'a') as f:
                  f.write(f'job_matrix={json.dumps(matrix)}\n')
                  f.write(f'tpu_v5_bypassed={\"true\" if bypass_v5 else \"false\"}\n')
                  f.write(f'should_run={\"true\" if should_run else \"false\"}\n')
          "

  tpu_v5_bypass_notice:
    name: "Presubmit on linux-x86-ct5lp-224-8tpu"
    needs: setup
    if: needs.setup.outputs.should_run != 'false' && needs.setup.outputs.tpu_v5_bypassed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Report TPU v5 Bypass Notice
        run: |
          echo "========================================================================"
          echo "NOTICE: TPU v5 (linux-x86-ct5lp-224-8tpu) Presubmit Bypassed"
          echo "========================================================================"
          echo "Self-hosted runner 'linux-x86-ct5lp-224-8tpu' presubmits have been"
          echo "bypassed for this run."
          echo ""
          echo "Active Bypass Indicators:"
          echo "  - Bypass Flag / Label / Title Tag: Detected"
          echo ""
          echo "If testing with RBE, check the 'RBE Hardware TPU Tests' workflow status."
          echo "========================================================================"

  run_tests:
    needs: setup
    if: needs.setup.outputs.should_run != 'false'
    name: "Presubmit on ${{ matrix.job_info.name || matrix.job_info.runner }}"
    # Available self-hosted runners.
    strategy:
      fail-fast: false
      matrix:
        job_info: ${{ fromJSON(needs.setup.outputs.job_matrix) }}
    # Use self-hosted runners. For a Linux runner, a corresponding container image used for the
    # workflow is required.
    # See go/ml-github-actions/getting_started/using_runners.md#supported-runner-scale-set.
    runs-on: ${{ matrix.job_info.runner }}
    container:
      image: "us-docker.pkg.dev/ml-oss-artifacts-published/ml-public-container/ml-build@sha256:480f397c57207671315a27173ccec790ea9c66ef030af96cbe6ac9b4a6613996"  # Tag infrastructure-public-image-2c74567ee8e0
      # Disable ipc isolation to prevent shm limit issues.
      options: --ipc=host

    steps:
      # Clone the GitHub repository to runner's environment $GITHUB_WORKSPACE, making its files
      # accessible for workflow to use. Otherwise, the workflow cannot find the files (e.g. ls -lR
      # will return "total 0").
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Keep the current commit's first parent fetchable
          # to resolve bazel-diff base SHA below.
          fetch-depth: 2

      # Git security patch (CVE-2022-24765) blocks root from operating on runner-owned directories:
      # https://github.blog/open-source/git/git-security-vulnerability-announced/#cve-2022-24765.
      # Tell Git explicitly to trust the workspace `/__w/torch_tpu/torch_tpu` inside this ephemeral
      # container.
      - name: Fix Git Workspace Ownership
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # Enable remote connections. Add a waiting step.
      # See go/ml-github-actions:connect#add-waiting-step.
      - name: Wait For Connection
        uses: google-ml-infra/actions/ci_connection@08e5394bb8179c66a50ac783fb8b2501a034c06f
        with:
          halt-dispatch-input: ${{ inputs.halt-for-connection }}
      - name: Run Impacted Tests via bazel-diff
        uses: ./.github/actions/bazel-diff
        with:
          base_sha: ${{ inputs.override_base_sha }}
          current_sha: ${{ inputs.override_current_sha || github.sha }}
          bazel_config: ${{ matrix.job_info.config }}
          extra_bazel_flags: ${{ matrix.job_info.extra_flags }}
          disable_bazel_diff: ${{ contains(github.event.pull_request.labels.*.name, 'ci:disable-bazel-diff') }}
