# Manual deep run of the TPU Python test suite against a staged release wheel,
# over the Cartesian product of TPU generation x Python version x released
# PyTorch version x dependency resolution (oldest or newest resolvable deps).
#
# release_candidate_tests.yml is the release gate: it runs each TPU test once,
# on its home generation, with the checked-in lock (default PyTorch, lowest
# direct deps) and Python 3.14. This workflow is the superset to reach for when
# a release needs more confidence or a failure needs isolating to one cell: it
# runs every TPU test on every selected generation, in every selected Python,
# against every selected PyTorch release and dependency bound. Each cell
# regenerates the uv lock for its Python with torch pinned to the cell's
# version, so the tests run through the same Bazel wheel-test path presubmit
# uses (--test_wheel against the wheel in dist/).
#
# Nightly PyTorch is deliberately not a dimension: release wheels ship without
# the nightly glue (--config=wheel_release), and the default pip hub resolves
# from the release index only.
#
# Sizing: the TPU v6e runner pool is small (two jobs at a time when this was
# written), so its cells queue behind each other and behind main's own v6e
# jobs. Trim the dimensions for v6e rather than dispatching the full product
# there.
name: Release Wheel Full Matrix Tests
run-name: Release wheel full matrix (${{ inputs.test_suite }}, ${{ inputs.gcs_wheel_dir }})

on:
  workflow_dispatch:
    inputs:
      gcs_wheel_dir:
        description: "GCS folder with staged wheels, e.g. gs://torch-tpu-release-artifacts/0.1.2/rc1/release/"
        required: true
        type: string
      source_sha:
        description: "Commit the wheel was built from; tests are checked out at this commit. Defaults to the dispatched ref."
        required: false
        type: string
        default: ""
      tpu_generations:
        description: "Comma-separated TPU generations (v5, v6, v7). Empty means all."
        required: false
        type: string
        default: ""
      python_versions:
        description: "Comma-separated Python versions from bazel/supported_python_versions.bzl. Empty means all."
        required: false
        type: string
        default: ""
      torch_versions:
        description: "Comma-separated released PyTorch versions from bazel/pytorch_versions.bzl (WHEEL_TORCH_VERSIONS and INTERMEDIATE_PATCH_VERSIONS). Empty means all."
        required: false
        type: string
        default: ""
      dep_resolutions:
        description: "Comma-separated dependency bounds: oldest (uv --resolution lowest-direct) and/or newest (highest). Empty means both."
        required: false
        type: string
        default: ""
      test_suite:
        description: "full: every TPU Python test for the generation (ci_tpu_v*). presubmit: the presubmit-v* subset (wheel_test_tpu_v*), which is empty on v6e because presubmit.yml has no v6e job."
        required: false
        type: choice
        options:
          - full
          - presubmit
        default: "full"
      test_targets:
        description: "Optional space-separated Bazel target patterns to run instead of the suite, e.g. //tests:ops_test_tpu-v5lite. The suite's tag filters still apply."
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.gcs_wheel_dir }}-${{ inputs.test_suite }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build_matrix:
    name: "Build the test matrix"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.generate.outputs.matrix }}
    env:
      TPU_GENERATIONS: ${{ inputs.tpu_generations }}
      PYTHON_VERSIONS: ${{ inputs.python_versions }}
      TORCH_VERSIONS: ${{ inputs.torch_versions }}
      DEP_RESOLUTIONS: ${{ inputs.dep_resolutions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - name: Generate matrix JSON
        id: generate
        run: |
          matrix=$(python3 -m ci.tools.release_test_matrix \
            --tpu_generations="${TPU_GENERATIONS}" \
            --python_versions="${PYTHON_VERSIONS}" \
            --torch_versions="${TORCH_VERSIONS}" \
            --dep_resolutions="${DEP_RESOLUTIONS}")
          echo "${matrix}" | python3 -c 'import json, sys; print(len(json.load(sys.stdin)["entry"]), "cells")'
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"

  test_wheel:
    needs: build_matrix
    name: "Test wheel on ${{ matrix.entry.tpu_name }} (Python ${{ matrix.entry.python_version }}, torch ${{ matrix.entry.torch_version }}, ${{ matrix.entry.deps }} deps)"
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.build_matrix.outputs.matrix) }}
    runs-on: ${{ matrix.entry.runner }}
    # A full v5e cell runs for over two hours.
    timeout-minutes: 240
    container:
      image: us-docker.pkg.dev/ml-oss-artifacts-published/ml-public-container/ml-build@sha256:30a9cf2ed330736957b3256dd3df69a13a556ae46626e9ad2ba205fa7a3c0051  # Tag infrastructure-public-image-f0ac56f68949 (built 2026-09-21)
      # Disable ipc isolation to prevent shm limit issues.
      options: --ipc=host
    env:
      GCS_WHEEL_DIR: ${{ inputs.gcs_wheel_dir }}
      TPU_GENERATION: ${{ matrix.entry.tpu_generation }}
      PYTHON_VERSION: ${{ matrix.entry.python_version }}
      TORCH_VERSION: ${{ matrix.entry.torch_version }}
      UV_RESOLUTION: ${{ matrix.entry.uv_resolution }}
      TEST_SUITE: ${{ inputs.test_suite }}
      TEST_TARGETS: ${{ inputs.test_targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - name: Fix Git Workspace Ownership
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Download staged wheel from GCS
        uses: ./.github/actions/download-staged-wheel
        with:
          gcs_wheel_dir: ${{ env.GCS_WHEEL_DIR }}
          python_version: ${{ env.PYTHON_VERSION }}
      # Same command requirements/lock_environments.sh uses for the checked-in
      # lock, plus the cell's torch pin and resolution. The @pypi hub reads
      # this file, so every test dependency (torchvision included) is
      # re-resolved around the pinned torch.
      - name: Lock dependencies for this cell
        run: |
          uv pip compile pyproject.toml \
            --all-extras \
            --python-version "${PYTHON_VERSION}" \
            --python-platform x86_64-manylinux_2_31 \
            --resolution "${UV_RESOLUTION}" \
            --constraint <(echo "torch==${TORCH_VERSION}") \
            --generate-hashes \
            --output-file "requirements/requirements_${PYTHON_VERSION//./_}.txt"
          grep -E '^(torch|torchvision|numpy)==' "requirements/requirements_${PYTHON_VERSION//./_}.txt"
      # full: every TPU Python test that can run on this generation, listed
      # explicitly so the `manual` nightly-only tests are included, minus what
      # no suite on main runs: the upstream PyTorch suites (wheel_test_excluded;
      # they need extra checkouts) and manual+nonightly targets, which
      # presubmit, postsubmit, and nightly all skip. presubmit: the
      # wheel_test_tpu_v* config on //..., as presubmit runs it.
      - name: Run TPU Python tests against the staged wheel
        run: |
          case "${TEST_SUITE}" in
            full)
              BAZEL_CONFIG="ci_tpu_${TPU_GENERATION}"
              TARGETS=$(bazel query 'kind("py_test", tests(//...)) except (attr("tags", "wheel_test_excluded", tests(//...)) union (attr("tags", "manual", tests(//...)) intersect attr("tags", "nonightly", tests(//...))))' | tr '\n' ' ')
              ;;
            presubmit)
              BAZEL_CONFIG="wheel_test_tpu_${TPU_GENERATION}"
              TARGETS="//..."
              ;;
            *)
              echo "::error::Unknown test_suite: ${TEST_SUITE}"
              exit 1
              ;;
          esac
          if [[ -n "${TEST_TARGETS}" ]]; then
            TARGETS="${TEST_TARGETS}"
          fi
          # Exit code 4 means the config's --test_tag_filters left nothing to
          # run, such as the presubmit suite on v6e; the cell then passes with
          # a notice instead of failing. Test timeouts come from the ci config
          # (--test_timeout=3600), as in postsubmit.
          # shellcheck disable=SC2086
          bazel test \
            --config="${BAZEL_CONFIG}" \
            --test_wheel=true \
            --//:wheel_build=True \
            --repo_env=HERMETIC_PYTHON_VERSION="${PYTHON_VERSION}" \
            --define PYTHON_VERSION="${PYTHON_VERSION}" \
            --test_lang_filters=py \
            --run_under="$(pwd)/ci/tools/parallel_accelerator_execute.sh" \
            ${TARGETS} || {
              status=$?
              [[ ${status} -eq 4 ]] || exit "${status}"
              echo "::notice::No ${TEST_SUITE} tests to run on TPU ${TPU_GENERATION}; this cell ran nothing."
            }
      - name: Upload test logs on failure
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: failure()
        with:
          name: bazel-testlogs-${{ matrix.entry.tpu_generation }}-py${{ matrix.entry.python_version }}-torch${{ matrix.entry.torch_version }}-${{ matrix.entry.deps }}
          path: bazel-testlogs/
          retention-days: 7
