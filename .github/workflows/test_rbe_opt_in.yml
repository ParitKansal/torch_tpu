# Runs the presubmit test suite on TPU hardware that is not the shared
# self-hosted ct5lp runner. Two paths live here:
#
#   relay     Bazel keeps the test actions local and a --run_under wrapper ships
#             each one over SSH to a single-chip Cloud TPU v5e VM leased from a
#             standing fleet in rbe-tpu-oss. This is the path that works today.
#   full RBE  Bazel sends the test actions to RBE workers that have TPU chips
#             attached. Needs worker pools that do not exist yet.
#
# Opt in per PR with a label:
#
#   ci:relay-tpu-v5    Run the relay alongside the normal presubmits and report
#                      advisory results. Never blocks the PR.
#   run-rbe            Same, for the full-RBE path.
#   ci:replace-tpu-v5  Take TPU v5 out of presubmit.yml's matrix and gate the PR
#                      on the relay instead. The relay job publishes its result
#                      under the ct5lp runner's check name, so branch protection
#                      sees the relay's real verdict.
#
# See docs/CI_PRESUBMIT_AND_RBE_GUIDE.md.

name: RBE Hardware TPU Tests (Opt-In)

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]
  workflow_dispatch:
    inputs:
      mode:
        description: 'shadow = advisory, replacement = gates the PR'
        type: choice
        default: 'shadow'
        options:
          - 'shadow'
          - 'replacement'
      hardware_path:
        description: 'relay = SSH to Cloud TPU VMs, full-rbe = TPU-attached RBE workers'
        type: choice
        default: 'relay'
        options:
          - 'relay'
          - 'full-rbe'
      test_suite:
        description: 'Test suite to execute'
        type: choice
        default: 'all'
        options:
          - 'all'
          - 'tpu_v5e_only'
          - 'cpu_only'

permissions:
  contents: read
  # Lets google-github-actions/auth mint a Workload Identity Federation token.
  id-token: write

concurrency:
  # Labels unrelated to RBE still fire a `labeled` event. Park those runs in a
  # group of their own so they can't cancel an RBE run already in flight.
  group: >-
    ${{ github.workflow }}-${{ github.head_ref || github.ref }}${{
    github.event.action == 'labeled'
    && !contains(fromJSON('["run-rbe", "ci:relay-tpu-v5", "ci:replace-tpu-v5"]'), github.event.label.name)
    && format('-ignored-label-{0}', github.run_id) || '' }}
  cancel-in-progress: true

env:
  # RBE streams results over its own gRPC channel; the Build Event Service
  # upload just adds latency here.
  RBE_BAZEL_FLAGS: --bes_backend=

  # Targets that don't yet run under full RBE. Each needs more than the single
  # chip an RBE worker exposes, or reaches the network mid-test.
  # TODO(jonathanskim): Tag these `no-rbe` in BUILD files and filter on the tag
  # so this list can't go stale.
  RBE_EXCLUDED_TARGETS: >-
    -//tests:fp4_test
    -//tests:ops_unit_test
    -//tests:async_transfer_test
    -//tests:ops_unit_test_tier3_cache
    -//tests:ops_unit_test_tier3_cache_no_backup
    -//tests/compile:activation_checkpointing_mem_test
    -//tests/distributed:single_tpu_pg_test

jobs:
  run_tests:
    name: "${{ matrix.job_info.name }}"
    # ci:replace-tpu-v5 deliberately does not appear here. That label gates the
    # PR, and full RBE needs TPU worker pools that do not exist yet, so a gating
    # run on this path would block every PR that asked for it.
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.hardware_path == 'full-rbe')
      || contains(github.event.pull_request.labels.*.name, 'run-rbe')
    continue-on-error: >-
      ${{ !(github.event_name == 'workflow_dispatch' && inputs.mode == 'replacement') }}
    strategy:
      fail-fast: false
      matrix:
        job_info:
          - name: "CPU Presubmit Tests"
            config: "ci_cpu_presubmit"
            suite: "cpu_only"
            extra_flags: ""
          - name: "TPU v5e Tests (Full RBE)"
            # `runs-on` is ubuntu-latest because Bazel ships the test actions
            # out to RBE, so state the hardware the tests land on explicitly.
            machine_type: "TPU v5e (RBE)"
            config: "ci_tpu_v5_full_rbe"
            suite: "tpu_v5e_only"
            extra_flags: "--test_tag_filters=presubmit-v5,-fails-on-tpu-v5,-nopresubmit,-notest,-nobuild"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Fix Git Workspace Ownership
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # Workload Identity Federation, because rbe-tpu-oss carries
      # constraints/iam.disableServiceAccountKeyCreation and so cannot hand out
      # exportable service account keys.
      - name: Check RBE credentials are configured
        id: creds
        env:
          WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          IS_GATING: >-
            ${{ contains(github.event.pull_request.labels.*.name, 'ci:replace-tpu-v5')
            || (github.event_name == 'workflow_dispatch' && inputs.mode == 'replacement') }}
        run: |
          if [[ -n "$WIF_PROVIDER" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "configured=false" >> "$GITHUB_OUTPUT"
          echo "::warning::RBE credentials are not configured." \
            "Set the GCP_WIF_PROVIDER and GCP_RBE_SERVICE_ACCOUNT repository" \
            "variables to point at a Workload Identity Federation provider" \
            "with access to rbe-tpu-oss."
          # A gating run that cannot reach RBE has verified nothing, so say so
          # instead of reporting a green check.
          if [[ "$IS_GATING" == "true" ]]; then
            echo "::error::ci:replace-tpu-v5 gates this PR on RBE, but RBE" \
              "credentials are missing. Configure Workload Identity Federation" \
              "or drop the label and let the TPU v5 presubmit run."
            exit 1
          fi

      - name: Authenticate to GCP RBE
        if: steps.creds.outputs.configured == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093  # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_RBE_SERVICE_ACCOUNT }}

      - name: Set up Bazel
        if: steps.creds.outputs.configured == 'true'
        # The npm package ships both `bazel` and `bazelisk` shims, and bazelisk
        # picks the version out of .bazelversion.
        run: sudo npm install -g @bazel/bazelisk

      - name: Run Test Suite
        if: >-
          steps.creds.outputs.configured == 'true'
          && (inputs.test_suite == null
          || inputs.test_suite == 'all'
          || inputs.test_suite == matrix.job_info.suite)
        env:
          BAZEL_CONFIG: ${{ matrix.job_info.config }}
          EXTRA_FLAGS: ${{ matrix.job_info.extra_flags }}
        run: |
          # EXTRA_FLAGS, RBE_BAZEL_FLAGS and RBE_EXCLUDED_TARGETS are
          # space-separated lists that have to word-split into separate Bazel
          # arguments.
          # shellcheck disable=SC2086
          bazel test \
            "--config=${BAZEL_CONFIG}" \
            --nocache_test_results \
            --test_output=errors \
            ${RBE_BAZEL_FLAGS} \
            ${EXTRA_FLAGS} \
            -- //tests/... ${RBE_EXCLUDED_TARGETS}

  relay_tpu_v5:
    # With ci:replace-tpu-v5 this job claims the ct5lp runner's check name, so
    # branch protection sees the relay's real verdict instead of presubmit.yml's
    # always-green bypass notice. GitHub only evaluates a job's `name:`
    # expression once the job is sent to a runner, so a skipped job publishes
    # this as raw text and cannot collide with the real ct5lp check.
    name: >-
      ${{ (contains(github.event.pull_request.labels.*.name, 'ci:replace-tpu-v5')
      || (github.event_name == 'workflow_dispatch' && inputs.mode == 'replacement'))
      && 'Presubmit on linux-x86-ct5lp-224-8tpu'
      || 'TPU v5e Tests (SSH Relay)' }}
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.hardware_path == 'relay')
      || contains(github.event.pull_request.labels.*.name, 'ci:relay-tpu-v5')
      || contains(github.event.pull_request.labels.*.name, 'ci:replace-tpu-v5')
    # Shadow runs report results without blocking. Replacement runs stand in for
    # the TPU v5 presubmit, so a failure has to block the PR.
    continue-on-error: >-
      ${{ !(contains(github.event.pull_request.labels.*.name, 'ci:replace-tpu-v5')
      || (github.event_name == 'workflow_dispatch' && inputs.mode == 'replacement')) }}
    runs-on: ubuntu-latest
    # One relay run at a time. Every run leases the whole fleet, so two of them
    # would each ask for more VMs than exist and spend the difference waiting on
    # flock. Queue instead of cancelling: the run that is already going has VMs
    # in hand.
    concurrency:
      group: relay-tpu-v5-fleet
      cancel-in-progress: false
    env:
      RELAY_POOL_DIR: ${{ runner.temp }}/tpu_pool
      RELAY_ZONES: ${{ vars.RELAY_TPU_ZONES || 'europe-west4-b' }}
      RELAY_REPORT_DIR: ${{ runner.temp }}/presubmit_report

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Fix Git Workspace Ownership
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Check relay credentials are configured
        id: creds
        env:
          WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          IS_GATING: >-
            ${{ contains(github.event.pull_request.labels.*.name, 'ci:replace-tpu-v5')
            || (github.event_name == 'workflow_dispatch' && inputs.mode == 'replacement') }}
        run: |
          if [[ -n "$WIF_PROVIDER" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "configured=false" >> "$GITHUB_OUTPUT"
          echo "::warning::The relay cannot reach rbe-tpu-oss." \
            "Set the GCP_WIF_PROVIDER and GCP_RBE_SERVICE_ACCOUNT repository" \
            "variables to a Workload Identity Federation provider whose" \
            "service account holds roles/tpu.admin in rbe-tpu-oss."
          # A gating run that never reached the hardware has verified nothing.
          if [[ "$IS_GATING" == "true" ]]; then
            echo "::error::ci:replace-tpu-v5 gates this PR on the relay, but" \
              "its credentials are missing. Configure Workload Identity" \
              "Federation or drop the label and let the ct5lp presubmit run."
            exit 1
          fi

      - name: Authenticate to GCP
        if: steps.creds.outputs.configured == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093  # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_RBE_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        if: steps.creds.outputs.configured == 'true'
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db  # v3.0.1
        with:
          project_id: rbe-tpu-oss

      - name: Set up Bazel
        if: steps.creds.outputs.configured == 'true'
        run: sudo npm install -g @bazel/bazelisk

      - name: Mint an SSH key for this run
        if: steps.creds.outputs.configured == 'true'
        run: |
          sudo apt-get install -y openssh-client || true
          mkdir -p "${RUNNER_TEMP}/ssh"
          # No passphrase: nothing interactive can answer a prompt here, and the
          # key dies with the runner.
          ssh-keygen -t ed25519 -N '' -C "torch-tpu-relay-${GITHUB_RUN_ID}" \
            -f "${RUNNER_TEMP}/ssh/relay_key"

      # `attach` borrows the standing fleet: it lists READY VMs, uploads this
      # run's public key to each, and writes one session file per VM. It never
      # creates or deletes hardware, so a failed run cannot cost anyone their
      # capacity.
      - name: Attach to the TPU v5e fleet
        if: steps.creds.outputs.configured == 'true'
        run: |
          read -r -a zone_args <<< "$(printf -- '--zone %s ' ${RELAY_ZONES})"
          scripts/spot_tpu_fleet.sh attach \
            --pool "${RELAY_POOL_DIR}" \
            --ssh-identity "${RUNNER_TEMP}/ssh/relay_key" \
            "${zone_args[@]}"
          echo "RELAY_JOBS=$(find "${RELAY_POOL_DIR}" -name '*.env' | wc -l)" \
            >> "$GITHUB_ENV"

      - name: Run the presubmit suite on TPU v5e
        if: steps.creds.outputs.configured == 'true'
        env:
          SSH_IDENTITY: ${{ runner.temp }}/ssh/relay_key
        run: |
          scripts/run_presubmit_v5_relay.sh \
            --session-pool "${RELAY_POOL_DIR}" \
            --output-dir "${RELAY_REPORT_DIR}" \
            --bazel-config ci_tpu_v5_relay \
            --jobs "${RELAY_JOBS}"

      - name: Upload the presubmit report
        if: always() && steps.creds.outputs.configured == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: relay-presubmit-report
          path: ${{ runner.temp }}/presubmit_report
          if-no-files-found: ignore

      # Never `down` here. The fleet belongs to whoever brought it up, and this
      # job only borrowed it.
      - name: Detach from the fleet
        if: always()
        run: scripts/spot_tpu_fleet.sh detach --pool "${RELAY_POOL_DIR}" || true
