# This file is used to configure Dependabot following
# https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference.
#
# TODO(b/498208430): decide whether to extend dependabot usage besides GitHub actions.
version: 2
updates:
  - package-ecosystem: "github-actions"
    # "/" covers .github/workflows/ and action YAMLs in the root directory,
    # but not composite actions in subdirectories.
    directories:
      - "/"
      - "/.github/actions/*"
    # Bundle version bumps into one PR to denoise.
    # If certain major releases block other version updates, split the group
    # by using `update-types: ["minor", "patch"]` so majors arrive alone.
    groups:
      github-actions:
        patterns:
          - "*"
    # To avoid spams, allow exactly one PR per month (on the first day of each month). 
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    # Skip releases younger than a week, so a compromised or regressed release
    # has time to be fixed before it is picked up.
    cooldown:
      default-days: 7
  # We don't use Dependabot for Python dependencies, but security updates are
  # enabled by an enforced enterprise configuration and can't be disabled at
  # the repo level. Allegedly, security updates respect `ignore` rules and an
  # ignore entry without `update-types` or `versions` blocks both version and
  # security updates, so this should suppress pip PRs without affecting the
  # GitHub Actions configuration above.
  # See https://github.com/google-pytorch/torch_tpu/issues/521.
  - package-ecosystem: "pip"
    directories:
      - "/"
      - "/requirements"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
